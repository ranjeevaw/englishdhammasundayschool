<form
  class="contact-form"
  action="https://formspree.io/f/YOUR_FORM_ID"
  method="POST"
>

  <!-- Name -->
  <input
    type="text"
    name="name"
    placeholder="Your Name"
    required
  >

  <!-- Email -->
  <input
    type="email"
    name="email"
    placeholder="Your Email"
    required
  >

  <!-- Message -->
  <textarea
    name="message"
    rows="5"
    placeholder="Message"
    required
  ></textarea>

  <!-- Optional subject -->
  <input
    type="hidden"
    name="_subject"
    value="New Message From English Dhamma Sunday School Website"
  >

  <!-- Redirect after submit -->
  <input
    type="hidden"
    name="_redirect"
    value="https://ranjeevaw.github.io/englishdhammasundayschool/thankyou.html"
  >

  <button type="submit">Send</button>

</form>
