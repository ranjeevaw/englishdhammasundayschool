<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .header-top {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      height: 100px;
      width: auto;
    }

    header h1 {
      margin: 0;
    }

    .event-section {
      margin-bottom: 50px;
    }

    .event-section h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

<header>

  <div class="header-top">
    <img src="logo.jpeg" alt="Logo" class="logo">
    <h1>Gallery</h1>
  </div>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Us</a>
    <a href="events.html">Events</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html">Contact Us</a>
  </nav>

</header>

<div class="container">

  <h2>Event Photo Gallery</h2>

  <!-- ========================= -->
  <!-- EVENT 1 -->
  <!-- ========================= -->

  <div class="event-section">
    <h3>Community Meetup - June 2026</h3>

    <div class="gallery">
      <img src="images/community1.jpg" alt="Community Meetup Photo 1">
      <img src="images/community2.jpg" alt="Community Meetup Photo 2">
      <img src="images/community3.jpg" alt="Community Meetup Photo 3">
    </div>
  </div>

  <!-- ========================= -->
  <!-- EVENT 2 -->
  <!-- ========================= -->

  <div class="event-section">
    <h3>Charity Fundraiser - July 2026</h3>

    <div class="gallery">
      <img src="images/charity1.jpg" alt="Charity Event Photo 1">
      <img src="images/charity2.jpg" alt="Charity Event Photo 2">
      <img src="images/charity3.jpg" alt="Charity Event Photo 3">
    </div>
  </div>

  <!-- ========================= -->
  <!-- EVENT 3 -->
  <!-- ========================= -->

  <div class="event-section">
    <h3>Annual Celebration - September 2026</h3>

    <div class="gallery">
      <img src="images/annual1.jpg" alt="Annual Celebration Photo 1">
      <img src="images/annual2.jpg" alt="Annual Celebration Photo 2">
      <img src="images/annual3.jpg" alt="Annual Celebration Photo 3">
    </div>
  </div>

</div>

<footer>
  © 2026 English Dhamma Sunday School
</footer>

</body>
</html>
